name: Materialize Reboot EP003-EP020

on:
  push:
    branches:
      - agent/reboot-manuscript-ep003-020-v1
    paths:
      - assets/reboot_ep003_020.tar.xz
      - scripts/materialize_reboot_ep003_020.py
      - .github/workflows/materialize-reboot-ep003-020.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reboot-manuscript-ep003-020-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize drafts and reviews
        run: python scripts/materialize_reboot_ep003_020.py
      - name: Remove one-time payload
        run: |
          git rm -f assets/reboot_ep003_020.tar.xz
          git rm -f scripts/materialize_reboot_ep003_020.py
          git rm -f .github/workflows/materialize-reboot-ep003-020.yml
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md README.md data/reboot_manuscript_progress_v1.json manuscript/reboot_v1 production/reviews/reboot_v1
          git commit -m "materialize reboot EP003-EP020"
          git push origin HEAD:agent/reboot-manuscript-ep003-020-v1
