name: Validate World Blueprint v3.3

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'COMPLETE_BLUEPRINT.md'
      - 'WORLD_BIBLE_COMPLETE.md'
      - 'WORLD_REFERENCE_QUICK.md'
      - '.github/workflows/validate-world-blueprint-v3-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build effective world
        run: python scripts/build_effective_world_v3_3.py

      - name: Validate world and blueprint structure
        run: python scripts/validate_world_blueprint_integration_v3_3.py --report-json data/world_blueprint_validation_report_v3_3.json

      - name: Validate 120 items, 24 sets, and 18 beasts
        run: python scripts/validate_collection_system_v3_3.py

      - name: Validate provisional canon governance
        run: python scripts/validate_collection_governance_v3_3.py
