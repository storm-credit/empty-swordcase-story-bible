name: Validate v2.9 prose preflight

on:
  push:
    paths:
      - 'data/episode_world_cast_cost_*.json'
      - 'data/supporting_cast_028.json'
      - 'data/world_settlements_048.json'
      - 'production/combat/ACTION_PREFLIGHT_041_200.md'
      - 'scripts/build_effective_episodes_v2_8.py'
      - 'scripts/build_prose_preflight_v2_9.py'
      - '.github/workflows/validate-v29-prose-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build effective v2.8 episode data
        run: python scripts/build_effective_episodes_v2_8.py
      - name: Build v2.9 prose preflight
        run: python scripts/build_prose_preflight_v2_9.py
      - name: Validate v2.9 prose preflight
        run: python scripts/validate_prose_preflight_v2_9.py
      - name: Upload complete preflight artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prose-preflight-v2.9
          path: |
            data/action_preflight_v2_9.json
            data/supporting_cast_voice_028_v2_9.json
            data/critical_continuity_ledger_v2_9.json
            data/project_manifest_v2_9.json
            production/combat/ACTION_PREFLIGHT_V2_9_COMPLETE.md
            docs/46_SUPPORTING_CAST_VOICE_BIBLE_V2_9.md
            docs/47_INJURY_EQUIPMENT_CONTINUITY_V2_9.md
            docs/48_FINAL_PROSE_PREFLIGHT_V2_9.md
            orchestra/PM_PROSE_PREFLIGHT_AUDIT_V2_9.md
            RELEASE_NOTES_V2_9.md
          if-no-files-found: error
